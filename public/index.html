<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B3F39" />
<title>Roleplay Coaster · ரோல்பிளே கோஸ்டர்</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ======================================================================
     DESIGN TOKENS — warm jewellery palette: deep teal + gold on cream.
     ====================================================================== */
  :root {
    --teal-950: #04211f;
    --teal-900: #062e2a;
    --teal-800: #0b3f39;
    --teal-700: #10504a;
    --teal-600: #17655d;
    --gold: #c9a227;
    --gold-soft: #e7c977;
    --gold-pale: #f6e7bd;
    --cream: #fbf7ee;
    --cream-2: #f4ecdd;
    --ink: #14312d;
    --ink-soft: #4b635e;
    --line: rgba(20, 49, 45, 0.12);
    --ok: #1f7a4d;
    --warn: #a8631b;
    --bad: #a5342c;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 11px;
    --shadow-card: 0 18px 40px -24px rgba(4, 33, 31, 0.55);
    --shadow-btn: 0 10px 24px -10px rgba(201, 162, 39, 0.75);
    --font: "Noto Sans Tamil", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font);
    color: var(--cream);
    background:
      radial-gradient(1100px 700px at 12% -10%, rgba(201, 162, 39, 0.16), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(23, 101, 93, 0.55), transparent 55%),
      linear-gradient(168deg, var(--teal-950) 0%, var(--teal-900) 45%, var(--teal-800) 100%);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    padding: 0 16px 48px;
  }

  /* A very light "roller-coaster track" texture. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.07;
    background-image:
      radial-gradient(circle at 20% 30%, #fff 0 1.5px, transparent 2px),
      radial-gradient(circle at 70% 80%, #fff 0 1.5px, transparent 2px);
    background-size: 160px 160px, 220px 220px;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  /* ---------------- header ---------------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 4px 18px;
  }
  .logo {
    width: 46px; height: 46px;
    border-radius: 14px;
    display: grid; place-items: center;
    background: linear-gradient(150deg, var(--gold-soft), var(--gold));
    color: var(--teal-950);
    font-size: 24px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15), 0 8px 18px -10px rgba(0,0,0,0.6);
    flex: none;
  }
  .brand-title { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
  .brand-sub { margin: 0; font-size: 12.5px; color: rgba(251, 247, 238, 0.62); }
  .step-badge {
    margin-left: auto;
    font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--gold-soft);
    border: 1px solid rgba(231, 201, 119, 0.35);
    padding: 6px 10px; border-radius: 999px; white-space: nowrap;
  }

  /* ---------------- cards ---------------- */
  .card {
    background: var(--cream);
    color: var(--ink);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(255, 255, 255, 0.55);
  }
  .card + .card { margin-top: 16px; }

  .card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .card-title { margin: 0; font-size: 17px; font-weight: 700; color: var(--teal-900); }
  .card-note { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }

  /* ---------------- hero ---------------- */
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hero-title { margin: 14px 0 0; font-size: 22px; color: var(--teal-900); letter-spacing: -0.2px; }
  .hero-line { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-soft); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(20, 49, 45, 0.07);
    color: var(--teal-800);
  }
  .pill.gold {
    background: linear-gradient(150deg, var(--gold-soft), var(--gold));
    color: #2a2103;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
  }

  .progress {
    height: 10px; margin: 16px 0 6px;
    background: rgba(20, 49, 45, 0.10);
    border-radius: 999px; overflow: hidden;
  }
  .progress > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    border-radius: 999px;
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-label { margin: 0 0 4px; font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* ---------------- buttons ---------------- */
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700;
    min-height: 56px; padding: 14px 22px;
    border-radius: var(--radius-md);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
    text-decoration: none;
  }
  .btn:active { transform: translateY(1px) scale(0.995); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-gold {
    background: linear-gradient(160deg, #f0d491 0%, var(--gold) 55%, #a8841b 100%);
    color: #2a2103;
    box-shadow: var(--shadow-btn), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .btn-gold:hover:not(:disabled) { filter: brightness(1.04); }

  .btn-ghost {
    background: rgba(20, 49, 45, 0.05);
    color: var(--teal-900);
    border: 1px solid var(--line);
    box-shadow: none;
  }
  .btn-ghost:hover { background: rgba(20, 49, 45, 0.09); }

  .btn-block { width: 100%; }
  .btn-shuffle { min-height: 78px; font-size: 19px; margin-top: 18px; letter-spacing: 0.2px; }
  .btn-shuffle .coaster { font-size: 24px; }

  /* ---------------- shuffle animation ---------------- */
  .spin-box { text-align: center; padding: 22px 6px 6px; }
  .spin-name {
    font-size: 27px; font-weight: 700; color: var(--teal-900);
    min-height: 44px; line-height: 1.3;
    animation: wobble 0.45s ease-in-out infinite alternate;
  }
  @keyframes wobble { from { transform: translateY(-2px); } to { transform: translateY(2px); } }
  .spin-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .track {
    height: 6px; width: 78%; margin: 18px auto 2px;
    border-radius: 999px; background: #e7dcc4; overflow: hidden; position: relative;
  }
  .track > span {
    position: absolute; top: 0; height: 100%; width: 32%;
    border-radius: 999px; background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    animation: slide 1s linear infinite;
  }
  @keyframes slide { from { left: -32%; } to { left: 100%; } }

  /* ---------------- result ---------------- */
  .pair {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px;
    align-items: stretch; margin: 16px 0 12px;
  }
  .pair-slot {
    background: var(--cream-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px 14px 12px;
    display: flex; flex-direction: column; gap: 1px;
  }
  .pair-role { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--ink-soft); font-weight: 600; }
  .pair-name { font-size: 19px; font-weight: 700; color: var(--teal-900); line-height: 1.25; }
  .pair-id { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
  .pair-plus { align-self: center; font-size: 20px; color: var(--gold); font-weight: 700; }

  .meta-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin: 0 0 14px;
  }
  .meta {
    font-size: 11.5px; font-weight: 600; color: var(--ink-soft);
    background: rgba(20, 49, 45, 0.05);
    border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 999px;
  }

  /* ---------------- chips ---------------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip {
    font-size: 13px; padding: 8px 12px; border-radius: 999px;
    background: var(--cream-2); border: 1px solid var(--line); color: var(--ink);
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .chip b { font-weight: 600; }
  .chip .eid { font-size: 10.5px; letter-spacing: 0.5px; color: var(--ink-soft); font-weight: 600; }

  /* ---------------- quick links ---------------- */
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .quick .btn { min-height: 52px; font-size: 14.5px; }
  .manager-link {
    display: block; margin: 18px auto 0; padding: 8px;
    background: none; border: 0; cursor: pointer;
    color: rgba(251, 247, 238, 0.55);
    font-family: inherit; font-size: 12.5px; text-decoration: underline;
  }
  .manager-link:hover { color: var(--gold-soft); }

  /* ---------------- notices ---------------- */
  .notice { border-radius: var(--radius-md); padding: 14px 16px; font-size: 14px; border: 1px solid transparent; }
  .notice.bad { background: #fdf0ee; border-color: rgba(165, 52, 44, 0.25); color: #6f1f19; }
  .notice.wait { background: #fdf6e8; border-color: rgba(168, 99, 27, 0.25); color: #6b4310; }
  .notice.good { background: #eef8f1; border-color: rgba(31, 122, 77, 0.22); color: #145c39; }
  .notice .ta { font-weight: 700; display: block; margin-bottom: 2px; }
  .notice code {
    display: block; margin-top: 8px; font-size: 12px;
    background: rgba(0,0,0,0.06); padding: 8px 10px; border-radius: 8px;
    word-break: break-word; white-space: pre-wrap;
  }

  .muted { color: var(--ink-soft); font-size: 13px; }
  .center { text-align: center; }

  /* ---------------- customer card (stage 3) ---------------- */
  .persona {
    background: linear-gradient(150deg, #f7e9c4, #e7c977);
    color: #3a2c05;
    border-radius: var(--radius-md);
    padding: 13px 16px;
    margin: 14px 0 12px;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
  }
  .secret-note {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 12.5px; color: var(--ink-soft);
    background: rgba(20, 49, 45, 0.05);
    border: 1px dashed rgba(20, 49, 45, 0.2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 16px;
  }

  .section-label {
    display: flex; align-items: baseline; gap: 8px;
    margin: 18px 0 8px;
    font-size: 13px; font-weight: 700; color: var(--teal-800);
  }
  .section-label .count {
    margin-left: auto; font-size: 12px; font-weight: 600; color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .attr-list { display: grid; gap: 8px; }
  .attr {
    appearance: none; width: 100%; text-align: left; cursor: pointer;
    font-family: inherit; color: var(--ink);
    display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start;
    background: var(--cream-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 12px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .attr:active { transform: scale(0.995); }
  .attr.on { background: #eef8f1; border-color: rgba(31, 122, 77, 0.4); }
  .attr:disabled { cursor: default; opacity: 0.85; }
  .attr-tick {
    width: 26px; height: 26px; margin-top: 1px;
    border-radius: 9px; border: 2px solid rgba(20, 49, 45, 0.22);
    display: grid; place-items: center;
    font-size: 15px; font-weight: 700; color: transparent;
    background: rgba(255,255,255,0.6);
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .attr.on .attr-tick { background: var(--ok); border-color: var(--ok); color: #fff; }
  .attr-name { display: block; font-size: 12.5px; font-weight: 700; color: var(--teal-800); }
  .attr-name .en { font-weight: 600; color: var(--ink-soft); font-size: 11.5px; }
  .attr-value { display: block; font-size: 14.5px; margin-top: 3px; line-height: 1.45; }

  .objection {
    border-left: 4px solid var(--gold);
    background: #fdf6e8;
    border-radius: 6px 14px 14px 6px;
    padding: 12px 14px;
    margin-top: 4px;
  }
  .obj-label {
    font-size: 10.5px; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--warn); font-weight: 700;
  }
  .obj-says { margin: 6px 0 8px; font-size: 15px; font-weight: 600; line-height: 1.5; }
  .obj-tip { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.55; }

  /* fixed action bar while the customer is ticking */
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--cream);
    border-top: 1px solid var(--line);
    box-shadow: 0 -16px 34px -24px rgba(4, 33, 31, 0.65);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .savebar-inner {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px;
  }
  .savebar-count {
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; min-width: 52px;
  }
  .savebar .btn { min-height: 50px; flex: 1; }
  body.has-savebar { padding-bottom: 110px; }

  /* ---------------- overlay / sheet ---------------- */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(4, 33, 31, 0.74);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px;
  }
  .sheet {
    background: var(--cream); color: var(--ink);
    width: 100%; max-width: 520px;
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .sheet h3 { margin: 0 0 6px; font-size: 18px; color: var(--teal-900); }
  .sheet-actions { display: grid; gap: 10px; margin-top: 18px; }
  @media (min-width: 600px) { .overlay { align-items: center; } }

  /* ---------------- misc ---------------- */
  .skeleton {
    height: 18px; border-radius: 8px;
    background: linear-gradient(90deg, rgba(20,49,45,0.08), rgba(20,49,45,0.16), rgba(20,49,45,0.08));
    background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .footer-note {
    text-align: center; font-size: 12px;
    color: rgba(251, 247, 238, 0.5); margin-top: 22px; line-height: 1.7;
  }

  /* ---------------- toast ---------------- */
  #toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 140%);
    background: var(--teal-950); color: var(--cream);
    border: 1px solid rgba(231, 201, 119, 0.4);
    padding: 13px 18px; border-radius: 14px;
    font-size: 13.5px; max-width: calc(100vw - 32px);
    box-shadow: 0 20px 40px -18px rgba(0,0,0,0.7);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    opacity: 0; visibility: hidden; z-index: 50;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

  @media (max-width: 420px) {
    .card { padding: 18px; }
    .step-badge { display: none; }
    .pair { grid-template-columns: 1fr; }
    .pair-plus { display: none; }
    .pair-name { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------------- stage 4 + 5 ---------------- */
  .sel, .inp, .note-in {
    font-family: inherit; font-size: 15px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px;
  }
  .inp { width: 100%; margin: 14px 0 12px; }
  .note-in { width: 100%; margin-top: 8px; font-size: 13.5px; min-height: 38px; padding: 7px 10px; }
  .row-card {
    display: flex; align-items: center; gap: 12px; margin-top: 8px;
    background: var(--cream-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  }
  .row-card.top { background: linear-gradient(150deg, #f7e9c4, #f1dca0); border-color: rgba(201,162,39,.5); }
  .row-card .grow { flex: 1; min-width: 0; }
  .rk { font-size: 22px; width: 34px; text-align: center; font-weight: 700; color: var(--teal-800); }
  .score { font-size: 22px; font-weight: 700; color: var(--teal-900); font-variant-numeric: tabular-nums; }
  .mini { min-height: 40px !important; padding: 6px 14px !important; font-size: 13.5px !important; border-radius: 12px !important; }
  .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .mod { margin-top: 18px; font-size: 13.5px; font-weight: 700; color: var(--teal-800); display: flex; gap: 8px; }
  .mod .count { margin-left: auto; font-weight: 600; color: var(--ink-soft); }
  .concept { background: var(--cream-2); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; margin-top: 8px; }
  .concept.done { background: #eef8f1; border-color: rgba(31,122,77,.35); }
  .c-ta { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .c-en { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
  .rbs { display: grid; grid-template-columns: repeat(6, 1fr) auto; gap: 6px; }
  .rb {
    appearance: none; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 700;
    min-height: 44px; border-radius: 11px; border: 1px solid var(--line); background: #fff; color: var(--teal-800);
  }
  .rb.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .rb.note { font-size: 15px; padding: 0 10px; }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="logo" aria-hidden="true">🎢</div>
      <div>
        <h1 class="brand-title">Roleplay Coaster</h1>
        <p class="brand-sub">ரோல்பிளே கோஸ்டர் · ஜுவல்லரி விற்பனை பயிற்சி</p>
      </div>
      <span class="step-badge" id="stepBadge"></span>
    </header>

    <main id="app" aria-live="polite"></main>

    <p class="footer-note">
      Roleplay Coaster · Google Sheets + Cloudflare Worker<br />
      <span id="buildInfo">Shuffle · Cards · Ratings · Leaderboard</span>
    </p>
  </div>

  <div id="toast" role="status"></div>

<script type="module">
/* ==========================================================================
   ROLEPLAY COASTER — front-end
   --------------------------------------------------------------------------
   Plain JavaScript, no build step. This file is the whole website: markup,
   styles (above) and behaviour (below). It only ever calls /api/... on the
   same domain, so no secret can reach the browser.

   STAGE 3 adds the customer card (persona, 12 attributes, objection) and the
   discovery ticks. Manager rating (stage 4) and leaderboard / history /
   rotation close (stage 5) come next.
   ========================================================================== */

/* ---------------------------- tiny utilities ---------------------------- */

/** Escape text before putting it into HTML (prevents XSS). */
function esc(value) {
  return String(value === undefined || value === null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

const $ = (selector, root = document) => root.querySelector(selector);

let toastTimer = null;
function toast(message) {
  const el = $("#toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 4200);
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/** A random index using the browser's crypto generator (not Math.random). */
function randomIndex(max) {
  if (max <= 1) return 0;
  const buffer = new Uint32Array(1);
  crypto.getRandomValues(buffer);
  return buffer[0] % max;
}

/** Call the Worker. Throws an Error carrying Tamil/English text. */
async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(state.managerToken && path.startsWith("/api/manager/") ? { Authorization: "Bearer " + state.managerToken } : {}),
      ...(options.headers || {}),
    },
  });

  let data = null;
  try { data = await response.json(); } catch (e) { data = null; }

  if (!response.ok) {
    const detail = (data && data.error) || {};
    const error = new Error(detail.message_en || "HTTP " + response.status);
    error.ta = detail.message_ta || "ஏதோ தவறு நடந்தது.";
    error.en = detail.message_en || "HTTP " + response.status;
    error.hint = detail.hint || "";
    error.code = detail.code || "";
    if (error.code === "MANAGER_AUTH" || error.code === "MANAGER_TOKEN_EXPIRED") saveToken("");
    throw error;
  }
  return data;
}

/* -------------------------------- render -------------------------------- */

function render() {
  const app = $("#app");
  const badge = $("#stepBadge");
  if (badge) badge.textContent = state.data ? "R" + state.data.rotation.number : "";

  document.body.classList.toggle("has-savebar", (state.view === "card" && !!state.card && !state.card.locked) || (state.view === "rate" && state.managerToken && !!state.rate));

  if (state.loading) { app.innerHTML = loadingCard(); return; }
  if (state.error && !state.data) { app.innerHTML = errorCard(state.error); return; }

  const y = window.scrollY;
  app.innerHTML = extraView() || (state.view === "card" ? cardView() : state.view === "result" ? resultView() : homeView());
  if (state.sheet) app.insertAdjacentHTML("beforeend", sheetView());
  window.scrollTo(0, state.view === lastKey ? y : 0);
  lastKey = state.view;
}

/* ------------------------------ actions --------------------------------- */

async function load() {
  state.loading = true;
  state.error = null;
  render();
  try {
    const data = await api("/api/state");
    state.data = data;
    state.session = data.session || null;
  } catch (error) {
    state.error = error;
  } finally {
    state.loading = false;
    render();
  }
}

async function shuffle() {
  if (state.spinning) return;

  state.spinning = true;
  state.error = null;
  render();

  const names = (state.data && state.data.staff ? state.data.staff : []).map((s) => s.name);
  let timer = null;

  if (names.length) {
    timer = setInterval(() => {
      const el = document.getElementById("spinName");
      if (el) el.textContent = names[randomIndex(names.length)];
    }, 70);
  }

  try {
    // Keep the animation visible for a moment even if the API answers instantly.
    const [result] = await Promise.all([
      api("/api/shuffle", { method: "POST", body: "{}" }),
      sleep(1200),
    ]);

    state.session = result.session;
    state.reused = !!result.reused;
    state.view = "result";
    state.reveal = null;

    // Refresh home data (progress / remaining) in the background.
    try {
      state.data = await api("/api/state");
    } catch (e) { /* the result screen still works */ }
  } catch (error) {
    state.error = error;
    toast(error.ta + " · " + error.en);
  } finally {
    if (timer) clearInterval(timer);
    state.spinning = false;
    render();
  }
}

/* --------------------------- stage 3 actions --------------------------- */

async function openCard() {
  if (!state.session) return;

  state.reveal = null;
  state.view = "card";
  state.card = null;
  state.cardError = null;
  state.cardLoading = true;
  state.ticks = [];
  state.dirty = false;
  render();

  try {
    const data = await api("/api/session/" + encodeURIComponent(state.session.sessionId) + "/card");
    state.card = data;
    state.ticks = Array.isArray(data.ticks) ? data.ticks.slice() : [];
    state.dirty = false;
  } catch (error) {
    state.cardError = error;
  } finally {
    state.cardLoading = false;
    render();
  }
}

function toggleAttr(id) {
  if (!state.card || state.card.locked || !id) return;

  const next = new Set(state.ticks);
  if (next.has(id)) next.delete(id);
  else next.add(id);

  // Keep the order of the card's attribute list, never the click order.
  state.ticks = state.card.card.attributes
    .map((attribute) => attribute.id)
    .filter((attributeId) => next.has(attributeId));

  state.dirty = true;
  render();
}

async function saveTicks(thenHome) {
  if (!state.card || state.saving) return;
  if (state.card.locked) {
    toast("மதிப்பீடு முடிந்தது — இனி மாற்ற முடியாது · Ticks are locked");
    return;
  }

  state.saving = true;
  render();

  try {
    const result = await api(
      "/api/session/" + encodeURIComponent(state.card.session.sessionId) + "/discovery",
      { method: "POST", body: JSON.stringify({ ticks: state.ticks }) }
    );

    state.ticks = result.ticks;
    state.card.ticks = result.ticks;
    state.card.markedBy = result.markedBy;
    state.card.markedAt = result.markedAt;
    state.dirty = false;

    toast("சேமிக்கப்பட்டது · Saved " + result.count + " / " + state.card.card.attributes.length);

    if (thenHome) {
      state.view = "home";
      state.card = null;
      state.saving = false;
      render();
      return void load();
    }
  } catch (error) {
    toast(error.ta + " · " + error.en);
  } finally {
    state.saving = false;
    render();
  }
}

function lbView() {
  const d = state.lb;
  if (state.lbErr) return `<section class="card">${head("🏆", "Leaderboard")}${errBox(state.lbErr)}</section>`;
  if (!d) return loadingCard();
  const medals = ["🥇", "🥈", "🥉"];
  const rows = d.rows.map((r) => `
    <div class="row-card ${r.rank <= 3 ? "top" : ""}">
      <span class="rk">${r.rank <= 3 ? medals[r.rank - 1] : r.rank}</span>
      <div class="grow"><b>${esc(r.name)}</b>
        <div class="muted">${r.rank <= 3 && d.prizes[r.rank - 1] ? "🎁 " + esc(d.prizes[r.rank - 1]) + " · " : ""}Discovery ${fmt(r.discoveryTotal)}/30 · Concepts ${fmt(r.conceptTotal)}/70</div></div>
      <span class="score">${fmt(r.total)}</span>
    </div>`).join("");
  return `<section class="card">${head("🏆 R" + esc(d.rotation.number), "தரவரிசை · Leaderboard")}
    <div class="meta-row" style="margin-top:12px">${rotSelect(d.rotations, d.rotation.number, "lb", false)}
      <span class="meta">${d.sessions.complete} complete · ${d.sessions.open} open · ${d.sessions.cancelled} cancelled</span></div>
    ${rows || `<p class="muted">இன்னும் முடிந்த அமர்வுகள் இல்லை · No completed sessions yet.</p>`}
  </section>`;
}

/* ---------- history (everyone) ---------- */
async function openHist(rot) {
  state.view = "hist"; state.hist = null; state.histErr = null; state.histRot = rot || ""; render();
  try { state.hist = await api("/api/history" + (rot ? "?rotation=" + rot : "")); } catch (e) { state.histErr = e; }
  render();
}
function histView() {
  const d = state.hist;
  if (state.histErr) return `<section class="card">${head("🕘", "History")}${errBox(state.histErr)}</section>`;
  if (!d) return loadingCard();
  const names = Array.from(new Set(d.rows.map((r) => r.salespersonName))).sort();
  const rows = d.rows.filter((r) => !state.histEmp || r.salespersonName === state.histEmp).map((r) => `
    <div class="row-card">
      <div class="grow"><b>${esc(r.salespersonName)}</b> → ${esc(r.customerName)}
        <div class="muted">${esc(r.sessionId)} · R${esc(r.rotation)} · ${esc(r.date)} · ${phaseLabel(r.phase)}</div>
        ${r.phase === "complete" ? `<div class="muted">Discovery ${fmt(r.discoveryScore)}/30 · Concepts ${fmt(r.conceptScore)}/70</div>` : ""}</div>
      ${r.phase === "complete" ? `<span class="score">${fmt(r.finalScore)}</span>` : ""}
    </div>`).join("");
  return `<section class="card">${head("🕘", "வரலாறு · History")}
    <div class="meta-row" style="margin-top:12px">
      ${rotSelect(d.rotations, state.histRot, "hist", true)}
      <select class="sel" data-sel="emp"><option value="">All employees</option>${names.map((n) => `<option ${n === state.histEmp ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
    ${rows || `<p class="muted">எதுவும் இல்லை · Nothing to show.</p>`}
    <p class="muted" style="margin:12px 0 0">Latest 100 sessions.</p>
  </section>`;
}

/* ---------- manager: login + session list ---------- */
function saveToken(token) {
  state.managerToken = token || "";
  try { token ? sessionStorage.setItem("rc_t", token) : sessionStorage.removeItem("rc_t"); } catch (e) {}
}
async function mgrLogin() {
  const box = $("#mpw");
  if (!box || state.busy) return;
  state.busy = true; state.mgrErr = null; render();
  try {
    const r = await api("/api/manager/login", { method: "POST", body: JSON.stringify({ password: box.value }) });
    saveToken(r.token);
    state.busy = false;
    return void openMgr();
  } catch (e) { state.mgrErr = e; }
  state.busy = false; render();
}
async function openMgr() {
  state.view = "mgr"; state.mgrList = null; render();
  if (!state.managerToken || !state.data) return;
  try { state.mgrList = await api("/api/history?rotation=" + state.data.rotation.number); }
  catch (e) { state.mgrErr = e; }
  render();
}
function mgrView() {
  if (!state.managerToken) {
    return `<section class="card">${head("🔐", "மேலாளர் உள்நுழைவு · Manager login")}
      <input id="mpw" class="inp" type="password" placeholder="கடவுச்சொல் · Password" autocomplete="current-password" />
      <button class="btn btn-gold btn-block" data-action="m-login" ${state.busy ? "disabled" : ""}>உள்நுழை · Log in</button>
      ${state.mgrErr ? errBox(state.mgrErr) : ""}</section>`;
  }
  const r = state.data ? state.data.rotation : { number: "", remaining: [] };
  const rows = state.mgrList ? state.mgrList.rows.filter((s) => s.rotation === r.number) : null;
  const list = rows === null ? `<div class="skeleton" style="margin-top:14px"></div>` : (rows.map((s) => `
    <div class="row-card" style="display:block">
      <b>${esc(s.salespersonName)}</b> → ${esc(s.customerName)}
      <div class="muted">${esc(s.sessionId)} · ${phaseLabel(s.phase)}${s.phase === "complete" ? " · <b>" + fmt(s.finalScore) + "/100</b>" : ""}</div>
      ${s.phase === "cancelled" ? "" : `<div class="acts">
        <button class="btn btn-gold mini" data-action="m-rate" data-id="${esc(s.sessionId)}" ${s.phase === "waiting_ticks" ? "disabled" : ""}>${s.phase === "complete" ? "பார் · View" : "மதிப்பிடு · Rate"}</button>
        ${s.phase === "complete" ? "" : `<button class="btn btn-ghost mini" data-action="m-cancel" data-id="${esc(s.sessionId)}">ரத்து · Cancel</button>`}
      </div>`}
    </div>`).join("") || `<p class="muted">இந்தச் சுற்றில் அமர்வுகள் இல்லை · No sessions yet.</p>`);
  return `<section class="card">${head("👤 R" + esc(r.number), "மேலாளர் · Manager")}
    ${state.mgrErr ? errBox(state.mgrErr) : ""}${list}
    <div class="acts" style="margin-top:18px">
      <button class="btn btn-gold" data-action="m-close">🏁 சுற்றை மூடு · Close rotation</button>
      <button class="btn btn-ghost" data-action="m-out">வெளியேறு · Log out</button></div>
  </section>`;
}

/* ---------- manager: rate concepts ---------- */
async function openRate(id) {
  state.view = "rate"; state.rate = null; state.rateErr = null; state.draft = {}; state.dirtyIds = new Set(); state.noteOpen = new Set(); render();
  try {
    const d = await api("/api/manager/session/" + encodeURIComponent(id));
    d.ratings.modules.forEach((m) => m.concepts.forEach((c) => {
      if (c.applicable) state.draft[c.conceptId] = { rating: c.rating, note: c.note || "" };
    }));
    state.rate = d;
  } catch (e) { state.rateErr = e; }
  render();
}
function rateCounts() {
  const ids = Object.keys(state.draft);
  return { total: ids.length, rated: ids.filter((k) => state.draft[k].rating !== null).length };
}
function rateView() {
  if (state.rateErr) return `<section class="card">${head("📝", "Rating", "rate-back")}${errBox(state.rateErr)}</section>`;
  const d = state.rate;
  if (!d) return loadingCard();
  const s = d.session, n = rateCounts();
  const mods = d.ratings.modules.map((m) => {
    const cs = m.concepts.filter((c) => c.applicable);
    if (!cs.length) return "";
    const done = cs.filter((c) => state.draft[c.conceptId].rating !== null).length;
    return `<div class="mod"><span>${esc(m.moduleNo)}. ${esc(m.tamil)}</span><span class="count">${done}/${cs.length}</span></div>` + cs.map((c) => {
      const dr = state.draft[c.conceptId];
      const btns = Array.from({ length: c.maxRating + 1 }, (_, v) => `<button class="rb ${dr.rating === v ? "on" : ""}" data-action="rate" data-c="${esc(c.conceptId)}" data-v="${v}">${v}</button>`).join("");
      return `<div class="concept ${dr.rating !== null ? "done" : ""}">
        <div class="c-ta">${esc(c.tamil)}</div><div class="c-en">${esc(c.english)}</div>
        <div class="rbs" style="grid-template-columns:repeat(${c.maxRating + 1},1fr) auto">${btns}<button class="rb note" data-action="note-toggle" data-c="${esc(c.conceptId)}" aria-label="note">📝</button></div>
        ${dr.note || state.noteOpen.has(c.conceptId) ? `<input class="note-in" data-note="${esc(c.conceptId)}" maxlength="300" placeholder="குறிப்பு · Note" value="${esc(dr.note)}" />` : ""}
      </div>`;
    }).join("");
  }).join("");
  const skipped = d.ratings.progress.totalConcepts - n.total;
  return `<section class="card">${head(esc(s.sessionId), "மதிப்பீடு · Rate concepts", "rate-back")}
    <p class="hero-line">${esc(s.salespersonName)} → ${esc(s.customerName)} · Discovery ${d.ticks.length}/12 found</p>
    ${d.card ? `<div class="objection" style="margin-top:12px"><div class="obj-label">${esc(d.card.persona)} · ${esc(d.card.objectionType)}</div><p class="obj-says">${esc(d.card.objection)}</p></div>` : ""}
    <p class="legend">0 = not covered · ${d.ratings.maxRating} = excellent · tap a selected number again to clear${skipped > 0 ? " · " + skipped + " concepts don't apply to this card" : ""}</p>
    ${mods}</section>
    <div class="savebar"><div class="savebar-inner">
      <span class="savebar-count" id="rateCount" style="min-width:70px">${n.rated} / ${n.total}</span>
      <button class="btn btn-gold" data-action="rate-save" ${state.saving || !state.dirtyIds.size ? "disabled" : ""}>சேமி · Save${state.dirtyIds.size ? " (" + state.dirtyIds.size + ")" : ""}</button>
    </div></div>`;
}
async function saveRatings() {
  if (state.saving || !state.dirtyIds.size) return;
  state.saving = true; render();
  const id = state.rate.session.sessionId;
  try {
    const ratings = Array.from(state.dirtyIds).map((c) => ({ conceptId: c, rating: state.draft[c].rating, note: state.draft[c].note }));
    const r = await api("/api/manager/session/" + encodeURIComponent(id) + "/ratings", { method: "POST", body: JSON.stringify({ ratings }) });
    state.dirtyIds = new Set();
    let msg = "சேமிக்கப்பட்டது · Saved " + r.progress.rated + " / " + r.progress.applicable;
    if (r.progress.allDone) {
      try {
        const h = await api("/api/history?rotation=" + state.rate.session.rotation);
        const row = h.rows.find((x) => x.sessionId === id);
        if (row) msg = "✅ Complete · " + fmt(row.finalScore) + " / 100";
      } catch (e) {}
    }
    toast(msg);
  } catch (e) { toast(e.ta + " · " + e.en); }
  state.saving = false; render();
}

/* ---------- confirmations + closing a rotation ---------- */
function sheetView() {
  const s = state.sheet;
  const left = state.data ? state.data.rotation.remaining.length : 0;
  const t = {
    cancel: ["இந்த அமர்வை ரத்து செய்யவா?", "Cancel session " + s.id + "? The salesperson can be shuffled again.", "ஆம், ரத்து செய் · Yes, cancel", "sh-cancel"],
    close: ["சுற்றை மூடவா?", "Close this rotation? The top 3 and prizes are recorded and the next rotation starts." + (left ? " ⚠ " + left + " people have not performed yet." : ""), "சுற்றை மூடு · Close rotation", "sh-close"],
    force: ["முடியாத அமர்வுகள் உள்ளன", (s.msg || "") + " Force-closing leaves them unfinished.", "கட்டாயமாக மூடு · Force close", "sh-force"],
  }[s.kind];
  return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true"><h3>${t[0]}</h3>
    <p class="muted" style="margin:0">${esc(t[1])}</p>
    <div class="sheet-actions"><button class="btn btn-gold btn-block" data-action="${t[3]}" ${state.busy ? "disabled" : ""}>${t[2]}</button>
    <button class="btn btn-ghost btn-block" data-action="sh-no">வேண்டாம் · Back</button></div></div></div>`;
}
async function mgrCall(path, body) {
  if (state.busy) return null;
  state.busy = true;
  try { return await api(path, { method: "POST", body: JSON.stringify(body || {}) }); }
  catch (e) { return { error: e }; }
  finally { state.busy = false; }
}
async function doCancel() {
  const r = await mgrCall("/api/manager/session/" + encodeURIComponent(state.sheet.id) + "/cancel");
  state.sheet = null;
  if (r && r.error) toast(r.error.ta + " · " + r.error.en);
  return void openMgr();
}
async function doClose(force) {
  const r = await mgrCall("/api/manager/rotation/close", { force });
  if (r && r.error) {
    state.sheet = r.error.code === "SESSIONS_OPEN" ? { kind: "force", msg: r.error.en } : null;
    if (!state.sheet) toast(r.error.ta + " · " + r.error.en);
    return void render();
  }
  state.closeRes = r; state.sheet = null; state.view = "closed"; render();
}
function closedView() {
  const c = state.closeRes.closed;
  const w = [["🥇", c.first], ["🥈", c.second], ["🥉", c.third]].map(([m, n], i) => `<div class="row-card ${n ? "top" : ""}"><span class="rk">${m}</span><div class="grow"><b>${esc(n || "—")}</b>${state.closeRes.prizes[i] ? `<div class="muted">🎁 ${esc(state.closeRes.prizes[i])}</div>` : ""}</div></div>`).join("");
  return `<section class="card">${head("🏁 R" + esc(c.number), "சுற்று மூடப்பட்டது · Rotation closed")}
    ${w}<p class="muted" style="margin:14px 0">${state.closeRes.next ? "Next: rotation R" + esc(state.closeRes.next.number) + " is now active." : "No further rotation row is available in the sheet — add one in Rotations."}</p>
    <button class="btn btn-gold btn-block" data-action="home">முகப்பு · Home</button></section>`;
}

function extraView() {
  const v = state.view;
  if (v === "lb") return lbView();
  if (v === "hist") return histView();
  if (v === "mgr") return mgrView();
  if (v === "rate" && state.managerToken) return rateView();
  if (v === "closed" && state.closeRes) return closedView();
  return null;
}

function extra(action, t) {
  const id = t.dataset.id;
  if (action === "nav-lb") return openLb();
  if (action === "nav-hist") return openHist();
  if (action === "manager") return openMgr();
  if (action === "m-login") return mgrLogin();
  if (action === "m-out") { saveToken(""); state.view = "home"; return render(); }
  if (action === "m-rate") return openRate(id);
  if (action === "m-cancel") { state.sheet = { kind: "cancel", id }; return render(); }
  if (action === "m-close") { state.sheet = { kind: "close" }; return render(); }
  if (action === "sh-no") { state.sheet = null; return render(); }
  if (action === "sh-cancel") return doCancel();
  if (action === "sh-close") return doClose(false);
  if (action === "sh-force") return doClose(true);
  if (action === "rate") {
    const c = t.dataset.c, v = Number(t.dataset.v), dr = state.draft[c];
    if (!dr) return;
    dr.rating = dr.rating === v ? null : v;
    state.dirtyIds.add(c);
    return render();
  }
  if (action === "note-toggle") { state.noteOpen.add(t.dataset.c); return render(); }
  if (action === "rate-save") return saveRatings();
  if (action === "rate-back") {
    if (state.dirtyIds.size && !confirm("சேமிக்காத மதிப்பீடுகள் உள்ளன. வெளியேறவா? · Unsaved ratings will be lost. Leave?")) return;
    return openMgr();
  }
}

document.addEventListener("change", (e) => {
  const key = e.target.dataset && e.target.dataset.sel;
  if (!key) return;
  if (key === "lb") openLb(e.target.value);
  else if (key === "hist") openHist(e.target.value);
  else if (key === "emp") { state.histEmp = e.target.value; render(); }
});
document.addEventListener("input", (e) => {
  const c = e.target.dataset && e.target.dataset.note;
  if (!c || !state.draft[c]) return;
  state.draft[c].note = e.target.value;       // no re-render: keeps the cursor in place
  state.dirtyIds.add(c);
  const b = document.querySelector('[data-action="rate-save"]');
  if (b) { b.disabled = false; b.textContent = "சேமி · Save (" + state.dirtyIds.size + ")"; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "mpw") mgrLogin();
});

/* One delegated click handler: survives every re-render. */
document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  if (!target) return;

  const action = target.dataset.action;

  if (action === "shuffle") return void shuffle();
  if (action === "retry") return void load();
  if (action === "open-session") {
    state.session = state.data.session;
    state.view = "result";
    state.reveal = null;
    return void render();
  }
  if (action === "close-card") {
    // Never lose ticks by walking away: save first if something changed.
    if (state.dirty && state.card && !state.card.locked) return void saveTicks(true);
    state.view = "home";
    state.reveal = null;
    state.card = null;
    state.ticks = [];
    render();
    return void load();
  }
  if (action === "home") {
    state.view = "home";
    state.reveal = null;
    state.card = null;
    state.ticks = [];
    render();
    return void load();
  }
  if (action === "reveal") { state.reveal = "confirm"; return void render(); }
  if (action === "reveal-yes") return void openCard();
  if (action === "reveal-no" || action === "close-sheet") {
    state.reveal = null;
    return void render();
  }
  if (action === "toggle-attr") return void toggleAttr(target.dataset.attr);
  if (action === "save-ticks") return void saveTicks(false);
  if (action === "save-done") return void saveTicks(true);
  if (action === "reload-card") return void openCard();
  return void extra(action, target);
});

/* Clicking the dark backdrop closes the sheet, but clicking inside it does not. */
document.addEventListener("click", (event) => {
  if (event.target.classList && event.target.classList.contains("overlay")) {
    state.reveal = null;
    render();
  }
});

render();
load();
</script>
</body>
</html>
