<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#530100">
<link rel="icon" type="image/png" href="/favicon.png">
<title>ரோல்ப்ளே கோஸ்டர் · Roleplay Coaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: showroom maroon (#530100, from the logo) + gold ===== */
:root{
  --brand-950:#2B0000; --brand-900:#530100; --brand-800:#6E1815; --brand-700:#8C2C27; --brand-100:#F0DDD9; --brand-50:#F9F0EE;
  --gold-700:#8A6A1E; --gold-500:#C8A04A; --gold-400:#E0BE6B; --gold-300:#EBD495; --gold-100:#F7EDCF;
  --mist:#F8F4F1; --paper:#FFFFFF; --ink:#2A1514; --muted:#735F5C; --line:#E8DDD8;
  --ruby:#9E2B3B; --ok:#1F7A5A; --warn:#9A6A12;
  --nav-h:64px; --r:16px;
  --display:"Cormorant Garamond","Noto Sans Tamil",Georgia,serif;
  --body:"Noto Sans Tamil","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-700)}
:focus-visible{outline:3px solid var(--gold-500);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
.en{font-size:.82em;color:var(--muted);font-weight:400;margin-left:.45em}
.stack .en{display:block;margin:0}
.on-dark .en,.hero .en,.stage .en,.btn-gold .en,.btn-teal .en,.bar .en{color:inherit;opacity:.75}
[hidden]{display:none!important}

/* ===== Shell ===== */
.top{background:var(--brand-900);color:var(--gold-300);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold-500)}
.top img{height:72px;width:auto;max-width:64%;display:block;flex:none}
.top .word{flex:1;min-width:0;text-align:right;font:700 18px/1.15 var(--display);letter-spacing:.3px}
.top .word small{display:block;margin-top:2px;font:400 11px/1.3 var(--body);color:var(--gold-400);opacity:.9;letter-spacing:0}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 150px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--brand-900);border-top:2px solid var(--gold-500);display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#D2B5B0;text-decoration:none;font-size:12px;line-height:1.2;text-align:center}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--gold-300)}
.nav a:active{background:rgba(255,255,255,.06)}

.foot{display:flex;justify-content:center;margin-top:26px}
.foot img{height:34px;width:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 14px}

/* ===== Common parts ===== */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card h2{font-size:18px;margin-bottom:10px}
.title{font:700 26px/1.25 var(--display);margin:6px 0 14px}
.title .ta{font-family:var(--body);font-size:22px}
.lead{color:var(--muted);margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border-radius:14px;border:1.5px solid var(--brand-700);background:var(--paper);color:var(--brand-800);font-weight:700;text-decoration:none;cursor:pointer;text-align:center;line-height:1.3}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-gold{background:linear-gradient(180deg,var(--gold-400),var(--gold-500));border-color:var(--gold-700);color:var(--brand-950)}
.btn-teal{background:var(--brand-800);border-color:var(--brand-800);color:var(--gold-100)}
.btn-danger{border-color:var(--ruby);color:var(--ruby)}
.btn-block{display:flex;width:100%}
.btn-sm{min-height:44px;padding:6px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 150px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--brand-100);color:var(--brand-800);white-space:nowrap}
.badge.wait{background:#FBEFCF;color:var(--warn)}
.badge.wait2{background:var(--gold-100);color:var(--gold-700)}
.badge.done{background:#D7EFE3;color:var(--ok)}
.badge.tie{background:#F6DADF;color:var(--ruby)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:99px;padding:4px 12px;font-size:14px}
.muted{color:var(--muted)}
.center{text-align:center}
.skeleton{padding:40px 0;text-align:center;color:var(--muted)}
.err{background:#FBECEE;border:1px solid #E8B9C1;color:#6E1B28;border-radius:12px;padding:12px 14px;margin:0 0 14px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom));z-index:40;max-width:560px;margin:0 auto;background:var(--brand-950);color:#fff;border-left:5px solid var(--gold-400);border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.bad{border-left-color:#E26B7B}
.toast .en{color:#E6D3CF}
.sticky{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:15;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(83,1,0,.12);padding:10px 16px}
.sticky .in{max-width:760px;margin:0 auto}
.sticky .sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;font-weight:700}
.sticky .sum b{font:700 24px/1 var(--display);color:var(--brand-800)}
.sticky .row>*{min-height:48px}

/* ===== Home ===== */
.hero{background:var(--brand-900);color:var(--gold-100);border-radius:22px;padding:20px 18px 26px;position:relative;overflow:hidden;margin-bottom:14px}
.hero .track{position:absolute;left:0;right:0;bottom:0;width:100%;height:110px;opacity:.35;pointer-events:none}
.hero>*{position:relative}
.rot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px}
.rot b{font:700 34px/1 var(--display);color:var(--gold-300)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-500),var(--gold-300));border-radius:99px;transition:width .6s}
.prog-text{margin:8px 0 0;font-size:15px}
.prog-text b{font:700 22px/1 var(--display);color:var(--gold-300)}
.shuffle-wrap{display:flex;flex-direction:column;align-items:center;padding:26px 0 4px}
.shuffle{width:min(64vw,236px);aspect-ratio:1;border-radius:50%;border:0;padding:9px;cursor:pointer;background:conic-gradient(from 200deg,#A57A22,#F3DC96,#C8A04A,#F7E7B0,#A57A22);box-shadow:0 0 0 7px rgba(224,190,107,.22),0 18px 36px rgba(0,0,0,.45)}
.shuffle .in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,var(--brand-700),var(--brand-900) 78%);color:var(--gold-300);box-shadow:inset 0 0 0 2px rgba(224,190,107,.5)}
.shuffle svg{width:64px;height:40px;stroke:var(--gold-300);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.shuffle .t1{font:700 30px/1.2 var(--body)}
.shuffle .t2{font:700 20px/1 var(--display);letter-spacing:.5px;opacity:.85}
.shuffle:active{transform:scale(.97)}
.shuffle[disabled]{filter:grayscale(.7) brightness(.8);cursor:not-allowed}
.hint{margin:16px 0 0;text-align:center;font-size:14px}
.open-card{border-color:var(--gold-500);background:var(--gold-100)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.names div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.names small{display:block;color:var(--muted);font-size:12px}
.names b{font-size:18px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mgr-link{text-align:center;font-size:13px;margin-top:4px}

/* ===== Ludo board (home) ===== */
.zone{border-radius:20px;padding:14px 14px 16px;margin:0 0 14px}
.zone>h2{font-size:17px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.zone>h2 .cnt{font:700 22px/1 var(--display)}
.zone.trackz{background:var(--brand-900);color:var(--gold-100);position:relative;overflow:hidden}
.zone.trackz .en{color:inherit;opacity:.75}
.zone.trackz .lane{position:absolute;left:0;right:0;top:34px;width:100%;height:96px;opacity:.5;pointer-events:none}
.zone.trackz>*{position:relative}
.slots{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:6px;margin:6px 0 10px}
.slots .vs{font:700 22px/1 var(--display);color:var(--gold-400);padding-top:26px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.slot small{font-size:12px;opacity:.8}
.slot .tk{max-width:100%}
.slot .tk .disc{width:68px;height:68px;font-size:30px}
.slot .tk .nm{font-size:16px;font-weight:700}
.zone.yardz{background:var(--brand-50);border:2px dashed #DDBDB7}
.zone.homez{background:linear-gradient(180deg,var(--gold-100),#FFFCF2);border:2px solid var(--gold-500)}
.tokens{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:12px 6px}
.tk{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.tk .disc{position:relative;width:46px;height:46px;border-radius:50%;background:var(--c);border:3px solid #fff;color:#fff;display:grid;place-items:center;font:700 20px/1 var(--body);box-shadow:0 3px 0 rgba(0,0,0,.28),0 6px 10px rgba(0,0,0,.16),inset 0 -5px 0 rgba(0,0,0,.2)}
.tk .disc::after{content:"";position:absolute;left:9px;right:12px;top:5px;height:9px;border-radius:50%;background:rgba(255,255,255,.38)}
.tk .nm{font-size:12px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .sc{font:700 16px/1 var(--display);color:var(--brand-800)}
.tk.guest .disc{border-style:dashed;border-color:var(--gold-300)}
.bdgs{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:18px}
.bdg{font-size:15px;line-height:1}
.hop{animation:hop .95s cubic-bezier(.3,.7,.4,1) both}
@keyframes hop{0%{transform:translateY(-90px) scale(1.35);opacity:0}35%{transform:translateY(0) scale(.88);opacity:1}55%{transform:translateY(-26px) scale(1.06)}75%{transform:translateY(0) scale(.97)}100%{transform:none}}
.legend summary{cursor:pointer;color:var(--brand-700);font-size:14px;min-height:32px;margin-top:10px}
.legend ul{padding:0;margin:6px 0 0}
.legend li{margin:8px 0;list-style:none}
.snd{display:inline-flex;align-items:center;gap:6px;margin-top:4px;min-height:36px;padding:2px 12px;border-radius:99px;border:1px solid rgba(235,212,149,.5);background:rgba(255,255,255,.08);color:var(--gold-300);font:400 12px/1 var(--body);cursor:pointer}
.snd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== Shuffle stage: dice roll ===== */
.stage{position:fixed;inset:0;z-index:50;background:var(--brand-950);color:var(--gold-100);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
.stage .en{color:inherit;opacity:.75}
.reels{display:grid;gap:14px;width:min(92vw,420px);margin:14px 0}
.reel{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid rgba(224,190,107,.4);border-radius:18px;padding:12px 14px;background:rgba(255,255,255,.04)}
.reel .rt{flex:1;min-width:0}
.reel small{display:block;color:var(--gold-400);font-size:13px}
.reel .nm{display:block;font:700 24px/1.3 var(--body);min-height:36px;filter:blur(2px);transition:filter .25s;overflow:hidden;text-overflow:ellipsis}
.reel.locked{border-color:var(--gold-400);background:rgba(224,190,107,.12)}
.reel.locked .nm{filter:none;color:var(--gold-300)}
.die{flex:none;margin:6px;width:68px;height:68px;border-radius:16px;background:#fff;padding:10px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);box-shadow:0 5px 0 #CFC2BE,0 10px 18px rgba(0,0,0,.4)}
.die i{display:block}
.die .pip{background:var(--brand-900);border-radius:50%;margin:1px}
.die.rolling{animation:tumble .45s linear infinite}
.die.land{animation:land .5s ease-out}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(90deg)}50%{transform:translateY(0) rotate(180deg)}75%{transform:translateY(-8px) rotate(270deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes land{0%{transform:translateY(-30px) rotate(40deg) scale(1.15)}60%{transform:translateY(0) rotate(-6deg) scale(.95)}100%{transform:none}}
.stage .sid{font:700 22px/1 var(--display);color:var(--gold-300);margin:4px 0 14px}
.stage .acts{display:grid;gap:10px;width:min(92vw,420px)}
.stage .btn{border-color:var(--gold-500)}

/* ===== Customer view ===== */
.gate{text-align:center;padding:10px 0}
.warn{background:#FBEFCF;border:1px solid #E9D089;border-radius:12px;padding:10px 14px;color:#5E4308;margin:12px 0}
.persona{background:var(--brand-900);color:var(--gold-100);border-radius:var(--r);padding:16px;margin-bottom:14px}
.persona .p{font:700 22px/1.4 var(--body);color:var(--gold-300)}
.attr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;cursor:pointer;min-height:64px}
.attr .tx{flex:1}
.attr .lb{font-weight:700}
.attr .vl{display:block;color:var(--muted);margin-top:2px}
.attr .box{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--gold-500);display:grid;place-items:center;color:transparent;font-size:22px;font-weight:700}
.attr[aria-checked="true"]{border-color:var(--ok);background:#EDF8F2}
.attr[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
.attr[disabled]{cursor:default}
.attr .box{font-family:var(--display)}
.opt{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;background:var(--brand-50);border:1px solid var(--brand-100);color:var(--muted);font-size:12px;font-weight:400;white-space:nowrap}
.how{background:var(--gold-100);border:1px solid var(--gold-300);border-radius:12px;padding:10px 14px;margin:0 0 12px;color:#4F3A07}
.askline{margin:8px 0;padding-left:26px}
.askline li{margin:4px 0}
.askline li.ok{color:var(--ok);font-weight:500}
.askline li.bad{color:var(--ruby)}
.askline li.opt{color:var(--muted)}
.askline small{font-size:12px}
.obj{border-left:6px solid var(--gold-500)}
.obj .say{font-size:18px;font-weight:500}

/* ===== Manager ===== */
.qrow{display:flex;flex-direction:column;gap:8px}
.qrow .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.mod{margin:22px 0 8px;padding:10px 14px;background:var(--brand-800);color:var(--gold-100);border-radius:12px;font-weight:700}
.concept{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.concept.missing{border-color:var(--ruby);background:#FFF7F8}
.concept .q{font-weight:500;margin-bottom:10px}
.rbar{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.rb{min-height:54px;border-radius:12px;border:1.5px solid var(--brand-100);background:var(--brand-50);font:700 22px/1 var(--display);color:var(--brand-800);cursor:pointer}
.rb.zero{grid-column:1/-1;font:700 15px/1.2 var(--body);min-height:46px;order:-1}
.rb[aria-pressed="true"]{background:var(--brand-800);border-color:var(--brand-800);color:var(--gold-300);box-shadow:0 0 0 3px var(--gold-300)}
.rb.zero[aria-pressed="true"]{background:var(--ruby);border-color:var(--ruby);color:#fff;box-shadow:0 0 0 3px #EBB7BF}
.concept details{margin-top:10px}
.concept summary{cursor:pointer;color:var(--brand-700);font-size:14px;min-height:32px}
.concept textarea{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;resize:vertical}
input[type=password],select{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}
.score3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.score3 div{background:var(--brand-50);border-radius:12px;padding:10px 4px}
.score3 b{display:block;font:700 28px/1.1 var(--display);color:var(--brand-800)}
.score3 small{font-size:12px;color:var(--muted)}
.score3 .full{grid-column:1/-1;background:var(--brand-800)}
.score3 .full b{color:var(--gold-300);font-size:34px}
.score3 .full small{color:var(--gold-100)}

/* ===== Leaderboard ===== */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:8px 0 18px}
.pod{background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 0 0;text-align:center;padding:12px 6px 14px;border-bottom:6px solid var(--gold-500)}
.pod .medal{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:700 24px/1 var(--display);color:var(--brand-950);background:linear-gradient(145deg,var(--gold-300),var(--gold-500))}
.pod.p1{padding-top:22px;padding-bottom:26px;background:var(--brand-900);color:var(--gold-100);border-bottom-color:var(--gold-300)}
.pod.p1 .medal{width:54px;height:54px;font-size:30px}
.pod.p2 .medal{background:linear-gradient(145deg,#F1F4F4,#A9B8B8)}
.pod.p3 .medal{background:linear-gradient(145deg,#EBC9A0,#B4793F)}
.pod .nm{font-weight:700;line-height:1.3;word-break:break-word}
.pod .sc{font:700 26px/1.1 var(--display);margin-top:4px}
.pod .sc small{font-size:13px;opacity:.7}
.pod .pz{font-size:13px;margin-top:4px;color:var(--gold-700)}
.pod.p1 .pz{color:var(--gold-300)}
.pod.empty{opacity:.45}
.tablewrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:500px}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{background:var(--brand-800);color:var(--gold-100);font-weight:700;font-size:13px;line-height:1.3}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.top3 td:first-child{font-weight:700;color:var(--gold-700)}

/* ===== History ===== */
.hrow{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.hrow .l1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.hrow .who{margin:6px 0 0;font-weight:500}

/* ===== Celebration ===== */
.celebrate{text-align:center}
.celebrate .big{font:700 40px/1.15 var(--display);color:var(--brand-800)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ===== Responsive + motion ===== */
@media (min-width:640px){
  .rb.zero{grid-column:auto;order:-1}
  .rbar{grid-template-columns:auto repeat(var(--n),1fr)}
  .names b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .confetti{display:none}
}
</style>
</head>
<body>

<header class="top">
  <img src="/logo-shop.png" width="201" height="72" alt="சுப ஸ்ரீ வள்ளி விலாஸ் · மு.வீ.பா சுப்பராய செட்டியார் சன்ஸ்">

<div id="toast-host"></div>

<script>
"use strict";
/* ============================================================
   Roleplay Coaster - frontend (plain JS, hash routing).
   All data comes from the Worker's /api/* endpoints.
   Every rendered value goes through html`` which escapes it.
   ============================================================ */

/* ---------- safe HTML templating (escapes everything by default) ---------- */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
class Raw { constructor(s) { this.s = s; } }
const flat = (v) => v instanceof Raw ? v.s : Array.isArray(v) ? v.map(flat).join("") : (v == null || v === false) ? "" : esc(v);
const html = (st, ...v) => new Raw(st.reduce((o, s, i) => o + s + (i < v.length ? flat(v[i]) : ""), ""));
// bilingual label: Tamil first, English beside it
const bi = (ta, en) => html`<span class="ta">${ta}</span><span class="en">${en}</span>`;

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt = (n) => { n = Number(n) || 0; return Number.isInteger(n) ? String(n) : String(+n.toFixed(2)); };
const app = $("#app");
const paint = (r) => { app.innerHTML = r.s; };
const loading = () => paint(html`<div class="skeleton">ஏற்றுகிறது… <span class="en">Loading…</span></div>`);

const State = { nav: 0, timers: [], home: null, shuffling: false };

/* status text (the sheet's English status -> Tamil + English) */
const STATUS = {
  "Waiting: customer ticks": ["காத்திருப்பு: வாடிக்கையாளர் டிக்", "Waiting: customer ticks", "wait"],
  "Waiting: manager ratings": ["காத்திருப்பு: மேலாளர் மதிப்பீடு", "Waiting: manager ratings", "wait2"],
  "Complete": ["முடிந்தது", "Complete", "done"],
};
const badge = (st) => { const s = STATUS[st] || [st, st, ""]; return html`<span class="badge ${s[2]}">${s[0]} · ${s[1]}</span>`; };

/* ---------- API ---------- */
class ApiError extends Error { constructor(status, ta, en) { super(en); this.status = status; this.ta = ta; this.en = en; } }
const MGR_KEY = "rc_manager";
function mgrToken() {
  try { const o = JSON.parse(localStorage.getItem(MGR_KEY) || "null"); if (o && o.expires > Date.now()) return o.token; } catch (e) { /* ignore */ }
  return null;
}
const setToken = (o) => { try { localStorage.setItem(MGR_KEY, JSON.stringify(o)); } catch (e) { /* ignore */ } };
const clearToken = () => { try { localStorage.removeItem(MGR_KEY); } catch (e) { /* ignore */ } };

async function api(path, opt = {}) {
  const headers = {};
  if (opt.body) headers["Content-Type"] = "application/json";
  if (opt.auth) {
    const t = mgrToken();
    if (!t) throw new ApiError(401, "மேலாளர் உள்நுழைவு தேவை அல்லது காலாவதியானது.", "Manager login required or expired.");
    headers.Authorization = "Bearer " + t;
  }
  let res;
  try { res = await fetch(path, { method: opt.method || "GET", headers, body: opt.body ? JSON.stringify(opt.body) : undefined }); }
  catch (e) { throw new ApiError(0, "இணைய இணைப்பு இல்லை.", "No internet connection."); }
  let data;
  try { data = await res.json(); } catch (e) { throw new ApiError(res.status, "சர்வர் பதில் புரியவில்லை.", "Unreadable server response."); }
  if (!data.ok) {
    if (res.status === 401 && opt.auth) clearToken();
    throw new ApiError(res.status, data.error?.ta || "தவறு நடந்தது.", data.error?.en || "Something went wrong.");
  }
  return data;
}

/* ---------- toast + error blocks ---------- */
let toastTimer;
function toast(ta, en, bad = false) {
  const host = $("#toast-host");
  host.innerHTML = html`<div class="toast ${bad ? "bad" : ""}" role="status">${ta}<span class="en" style="display:block;margin:0">${en}</span></div>`.s;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { host.innerHTML = ""; }, bad ? 6000 : 3000);
}
const toastErr = (e) => toast(e.ta || "தவறு நடந்தது.", e.en || "Something went wrong.", true);
const errBlock = (e, retry = true) => html`<div class="err" role="alert"><b>${e.ta || "தவறு நடந்தது."}</b><br><span class="en" style="margin:0">${e.en || "Something went wrong."}</span></div>
  ${retry ? html`<button class="btn btn-block" data-act="reload">மீண்டும் முயற்சி <span class="en">Try again</span></button>` : ""}`;

// run an async action while disabling its button (stops double taps)
async function busy(btn, fn) {
  if (btn.disabled) return;
  btn.disabled = true; btn.setAttribute("aria-busy", "true");
  try { return await fn(); }
  finally { btn.disabled = false; btn.removeAttribute("aria-busy"); }
}

/* ---------- sound (tiny synthesised effects, no audio files) + mute button ---------- */
const Snd = { on: (() => { try { return localStorage.getItem("rc_sound") !== "off"; } catch (e) { return true; } })(), ctx: null };
function audio() {
  if (!Snd.on) return null;
  try {
    Snd.ctx = Snd.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (Snd.ctx.state === "suspended") Snd.ctx.resume();
    return Snd.ctx;
  } catch (e) { return null; }
}
function tone(freq, at, dur, type = "sine", vol = 0.15, to = 0) {
  const c = audio(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
const Sound = {
  rattle() { for (let i = 0; i < 15; i++) tone(160 + Math.random() * 240, i * 0.17, 0.06, "square", 0.05); },
  land() { tone(520, 0, 0.12, "triangle", 0.2); tone(780, 0.1, 0.2, "triangle", 0.2); },
  whoosh() { tone(220, 0, 0.5, "sawtooth", 0.07, 1400); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.28, "triangle", 0.2)); tone(1047, 0.5, 0.6, "triangle", 0.2); },
};
function setSoundUi() {
  const b = $("#snd"); if (!b) return;
  b.setAttribute("aria-pressed", String(Snd.on));
  b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/>${Snd.on ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M16 9l5 6M21 9l-5 6"/>'}</svg>${Snd.on ? "ஒலி ஆன்" : "ஒலி ஆஃப்"}`;
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("#snd")) return;
  Snd.on = !Snd.on;
  try { localStorage.setItem("rc_sound", Snd.on ? "on" : "off"); } catch (err) { /* ignore */ }
  setSoundUi(); if (Snd.on) Sound.land();
});

/* ---------- confetti (celebration + perfect scores) ---------- */
function confettiBurst() {
  if (reduced()) return;
  const box = document.createElement("div"); box.className = "confetti";
  const colors = ["#E0BE6B", "#C8A04A", "#F7EDCF", "#8C2C27", "#1F7A5A", "#9E2B3B"];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%"; p.style.background = colors[i % colors.length];
    p.style.animationDuration = 2.5 + Math.random() * 3 + "s"; p.style.animationDelay = Math.random() * 1.5 + "s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 8000);
}

/* ---------- badges + Ludo tokens (shared by Home, Leaderboard, Result) ---------- */
const BADGES = {
  perfect:  ["🎯", "சரியான வரிசை", "Perfect Order", "கேள்விகளை சரியான வரிசையில் கேட்டார்", "Asked every order-scored question in the right order"],
  mind:     ["🧠", "மனம் படிப்பவர்", "Mind Reader", "அனைத்து விவரங்களையும் கண்டறிந்தார்", "Discovered every attribute"],
  budget:   ["💰", "பட்ஜெட் பாஸ்", "Budget Boss", "பட்ஜெட்டை கடைசியாக, சரியான இடத்தில் கேட்டார்", "Asked the budget last, in the right place"],
  comeback: ["📈", "முன்னேற்றம்", "Comeback", "முந்தைய சுழற்சியை விட அதிக மதிப்பெண்", "Scored higher than their previous rotation"],
  hattrick: ["🔥", "ஹாட்ட்ரிக்", "Hat-trick", "தொடர்ந்து 3 சுழற்சிகளில் முடித்தார்", "Completed 3 rotations in a row"],
};
const badgesHtml = (list) => html`${(list || []).filter((k) => BADGES[k]).map((k) => html`<span class="bdg" role="img" title="${BADGES[k][1]} · ${BADGES[k][2]}" aria-label="${BADGES[k][2]}">${BADGES[k][0]}</span>`)}`;
const TOKEN_COLORS = ["#B3322A", "#1F7A5A", "#B8860B", "#2563A8", "#7B3FA0", "#C2620F"];
const colorOf = (id) => TOKEN_COLORS[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % TOKEN_COLORS.length];
function initialOf(name) {
  const n = String(name).trim();
  try { const g = [...new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(n)]; return (g[0]?.segment || "?").toUpperCase(); }
  catch (e) { return (Array.from(n)[0] || "?").toUpperCase(); }
}
// one Ludo token: coloured disc with the person's initial
const token = (p, cls = "", extra = "") => html`<div class="tk ${cls}" style="--c:${colorOf(p.id)}" title="${p.name}"><span class="disc" aria-hidden="true">${initialOf(p.name)}</span><span class="nm">${p.name}</span>${extra}</div>`;

/* ---------- router ---------- */
const routes = [
  [/^\/$/, viewHome],
  [/^\/customer\/(S\d{3,6})$/, viewCustomer],
  [/^\/leaderboard(?:\/(\d{1,3}))?$/, viewLeaderboard],
  [/^\/history$/, viewHistory],
  [/^\/manager$/, viewManager],
  [/^\/manager\/rate\/(S\d{3,6})$/, viewRate],
  [/^\/celebrate$/, viewCelebrate],
];
const go = (p) => { location.hash = "#" + p; };

async function route() {
  const my = ++State.nav;
  State.timers.forEach(clearInterval); State.timers = [];
  $$(".confetti").forEach((n) => n.remove());
  const path = location.hash.slice(1) || "/";
  const first = path.split("/")[1] || "home";
  $$(".nav a").forEach((a) => (a.dataset.nav === first || (first === "celebrate" && a.dataset.nav === "manager")
    ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  window.scrollTo(0, 0);
  for (const [re, fn] of routes) {
    const m = re.exec(path);
    if (m) {
      try { await fn(...m.slice(1)); }
      catch (e) { if (my === State.nav) paint(errBlock(e)); }
      return;
    }
  }
  go("/");
}
window.addEventListener("hashchange", route);
const stale = (my) => my !== State.nav; // true when the user already moved to another screen

/* ---------- event delegation (no inline handlers) ---------- */
const Actions = {};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = Actions[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener("change", (e) => { const el = e.target.closest("[data-change]"); if (el && Actions[el.dataset.change]) Actions[el.dataset.change](el, e); });
document.addEventListener("input", (e) => { const el = e.target.closest("[data-input]"); if (el && Actions[el.dataset.input]) Actions[el.dataset.input](el, e); });
document.addEventListener("submit", (e) => { const el = e.target.closest("[data-submit]"); if (el) { e.preventDefault(); if (Actions[el.dataset.submit]) Actions[el.dataset.submit](el, e); } });
Actions.reload = () => route();

/* ============================================================
   HOME
   ============================================================ */
async function viewHome() {
  const my = State.nav; loading();
  const s = (await api("/api/state")); State.home = s;
  if (stale(my)) return;
  paintHome(s);
  // light refresh so a second phone sees the open session
  State.timers.push(setInterval(async () => {
    if (State.shuffling) return;
    try { const n = await api("/api/state"); State.home = n; if (!State.shuffling && !stale(my)) paintHome(n); } catch (e) { /* keep old screen */ }
  }, 15000));
}

function paintHome(s) {
  const pct = s.total ? Math.round((s.performed / s.total) * 100) : 0;
  const open = s.open;
  const noneLeft = s.remaining.length === 0;
  let hint;
  if (open) hint = html`ஒரு செஷன் நடந்துகொண்டிருக்கிறது<span class="en">A session is in progress</span>`;
  else if (noneLeft && s.canClose) hint = html`அனைவரும் முடித்தனர். மேலாளர் சுழற்சியை மூடலாம்.<span class="en">Everyone is done. The manager can close the rotation.</span>`;
  else if (noneLeft) hint = html`அனைவரும் செய்துவிட்டனர். மதிப்பீடுகள் முடிய காத்திருக்கிறோம்.<span class="en">Everyone has performed. Waiting for ratings.</span>`;
  else hint = html`பகடையை உருட்ட பட்டனை அழுத்துங்கள்<span class="en">Tap to roll the dice</span>`;

  const hop = open && State.hop === open.id ? "hop" : "";
  if (hop) Sound.whoosh();
  State.hop = null;
  const players = s.board?.players || [];
  const yard = players.filter((p) => p.zone === "yard");
  const home = players.filter((p) => p.zone === "home").sort((a, b) => a.turn - b.turn);

  paint(html`
    <section class="hero">
      <svg class="track" viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true"><path d="M0 100C40 100 50 30 90 30s40 60 80 60 50-70 100-70 60 60 130 60" fill="none" stroke="#E0BE6B" stroke-width="3"/></svg>
      <p class="rot"><span>சுழற்சி<span class="en">Rotation</span></span><b>${s.rotation.no}</b></p>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.performed}"><i style="width:${pct}%"></i></div>
      <p class="prog-text"><b>${s.performed}</b> / ${s.total} செய்து முடித்தவர்கள்<span class="en">performed</span></p>
      <div class="shuffle-wrap">
        <button class="shuffle" data-act="shuffle" ${open || noneLeft ? "disabled" : ""} aria-label="Roll the dice">
          <span class="in">
            <svg viewBox="0 0 64 40" aria-hidden="true"><path d="M3 34c8 0 9-26 19-26s8 22 16 22 7-24 23-24"/></svg>
            <span class="t1">குலுக்கு</span><span class="t2">Roll the dice</span>
          </span>
        </button>
        <p class="hint">${hint}</p>
      </div>
    </section>

    <section class="zone trackz" aria-label="Track">
      <svg class="lane" viewBox="0 0 400 96" preserveAspectRatio="none" aria-hidden="true"><path d="M0 80C50 80 60 20 110 20s45 60 95 60 55-70 110-70 60 70 85 70" fill="none" stroke="#E0BE6B" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/></svg>
      <h2><span>களம் <span class="en">Track · playing now</span></span></h2>
      ${open ? html`
        <div class="slots">
          <div class="slot">${token(open.salesperson, hop)}<small>விற்பனையாளர் · Salesperson</small></div>
          <div class="vs" aria-hidden="true">↔</div>
          <div class="slot">${token(open.customer, hop + " guest")}<small>வாடிக்கையாளர் · Customer</small></div>
        </div>
        <p class="center" style="margin:0 0 10px">செஷன் ${open.id} · ${badge(open.status)}</p>
        <a class="btn btn-gold btn-block stack" href="#/customer/${open.id}"><span>நான் வாடிக்கையாளர்<span class="en">I am the customer</span></span></a>`
      : html`<p class="center" style="margin:26px 0 10px">அடுத்த ஆட்டத்துக்குத் தயார்<span class="en" style="display:block;margin:0">Ready for the next turn</span></p>`}
    </section>

    <section class="zone yardz" aria-label="Yard">
      <h2><span>முற்றம் <span class="en">Yard · waiting for their turn</span></span><span class="cnt">${yard.length}</span></h2>
      ${yard.length ? html`<div class="tokens">${yard.map((p) => token(p))}</div>`
        : html`<p class="muted" style="margin:0">யாரும் இல்லை <span class="en">Nobody waiting</span></p>`}
    </section>

    <section class="zone homez" aria-label="Home">
      <h2><span>இல்லம் <span class="en">Home · finished</span></span><span class="cnt">${home.length}</span></h2>
      ${home.length ? html`<div class="tokens">${home.map((p) => token(p, "", html`<span class="sc">${fmt(p.final)}</span><span class="bdgs">${badgesHtml(p.badges)}</span>`))}</div>`
        : html`<p class="muted" style="margin:0">இன்னும் யாரும் முடிக்கவில்லை <span class="en">Nobody has finished yet</span></p>`}
      <details class="legend"><summary>பேட்ஜ்கள் <span class="en">Badges</span></summary>
        <ul>${Object.values(BADGES).map((b) => html`<li>${b[0]} <b>${b[1]}</b><span class="en">${b[2]}</span><br><span class="muted">${b[3]}<span class="en" style="display:block;margin:0">${b[4]}</span></span></li>`)}</ul>
      </details>
    </section>

    <div class="links">
      <a class="btn" href="#/leaderboard">தரவரிசை <span class="en">Leaderboard</span></a>
      <a class="btn" href="#/history">வரலாறு <span class="en">History</span></a>
    </div>
    <p class="mgr-link"><a href="#/manager">மேலாளர் உள்நுழைவு <span class="en">Manager login</span></a></p>
  `);
}

/* ---------- the shuffle: a dice roll (cosmetic only; the Worker still picks with crypto-random) ---------- */
const FACES = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const dieFace = (n) => html`${Array.from({ length: 9 }, (_, i) => (FACES[n].includes(i) ? html`<i class="pip"></i>` : html`<i></i>`))}`.s;
const d6 = () => 1 + Math.floor(Math.random() * 6);

Actions.shuffle = async () => {
  if (State.shuffling) return;
  State.shuffling = true;
  const pool = State.home?.activeNames?.length ? State.home.activeNames : ["…"];
  const rnd = () => pool[Math.floor(Math.random() * pool.length)];
  const stage = document.createElement("div");
  stage.className = "stage"; stage.setAttribute("role", "dialog"); stage.setAttribute("aria-modal", "true");
  stage.innerHTML = html`
    <h2>பகடை உருளுகிறது… <span class="en">Rolling the dice…</span></h2>
    <div class="reels">
      <div class="reel" id="reel-s"><div class="die rolling" id="die-s"></div><div class="rt"><small>விற்பனையாளர் · Salesperson</small><span class="nm">…</span></div></div>
      <div class="reel" id="reel-c"><div class="die rolling" id="die-c"></div><div class="rt"><small>வாடிக்கையாளர் · Customer</small><span class="nm">…</span></div></div>
    </div>
    <div id="stage-foot"></div>`.s;
  document.body.appendChild(stage);
  document.body.style.overflow = "hidden";
  const ns = $("#reel-s .nm", stage), nc = $("#reel-c .nm", stage), ds = $("#die-s", stage), dc = $("#die-c", stage);
  let lockS = false, lockC = false;
  const flick = setInterval(() => {
    if (!lockS) { ns.textContent = rnd(); ds.innerHTML = dieFace(d6()); }
    if (!lockC) { nc.textContent = rnd(); dc.innerHTML = dieFace(d6()); }
  }, 90);
  Sound.rattle();
  const close = () => { clearInterval(flick); stage.remove(); document.body.style.overflow = ""; State.shuffling = false; };
  Actions.closeStage = (el) => { close(); if (el.tagName !== "A") route(); };
  const land = (die, reel, nameEl, name) => {
    nameEl.textContent = name; die.innerHTML = dieFace(d6());
    die.classList.remove("rolling"); die.classList.add("land"); reel.classList.add("locked"); Sound.land();
  };
  const t0 = Date.now();
  try {
    const r = await api("/api/shuffle", { method: "POST" });
    await sleep(Math.max(0, (reduced() ? 400 : 2600) - (Date.now() - t0)));
    lockS = true; land(ds, $("#reel-s", stage), ns, r.salesperson.name);
    await sleep(reduced() ? 0 : 900);
    lockC = true; land(dc, $("#reel-c", stage), nc, r.customer.name);
    clearInterval(flick);
    State.hop = r.sessionId; // the two tokens hop onto the Track when Home redraws
    $("h2", stage).innerHTML = html`தேர்வு முடிந்தது! <span class="en">Picked!</span>`.s;
    $("#stage-foot", stage).innerHTML = html`
      <p class="sid">செஷன் ${r.sessionId} <span class="en">Session ${r.sessionId}</span></p>
      <div class="acts">
        <a class="btn btn-gold stack" href="#/customer/${r.sessionId}" data-act="closeStage"><span>நான் வாடிக்கையாளர்<span class="en">I am the customer</span></span></a>
        <button class="btn btn-teal" data-act="closeStage">களத்தைப் பார் <span class="en">See the board</span></button>
      </div>`.s;
  } catch (e) {
    close(); toastErr(e); route();
  }
};

// badge text: the asking sequence number for order-scored attributes, a tick for optional ones
function seqNo(id) {
  if (!Cust.ordered.has(id)) return "✓";
  const i = Cust.ticks.filter((t) => Cust.ordered.has(t)).indexOf(id);
  return i < 0 ? "✓" : String(i + 1);
}
Actions.tick = (btn) => {
  if (Cust.locked) return;
  const id = btn.dataset.id, i = Cust.ticks.indexOf(id);
  if (i >= 0) Cust.ticks.splice(i, 1); else Cust.ticks.push(id); // untick renumbers the rest
  $$(".attr").forEach((b) => {
    b.setAttribute("aria-checked", String(Cust.ticks.includes(b.dataset.id)));
    $(".box", b).textContent = seqNo(b.dataset.id);
  });
  $("#found").textContent = `${Cust.ticks.length} / ${Cust.total}`;
};
Actions.saveTicks = (btn) => busy(btn, async () => {
  try {
    const r = await api("/api/ticks", { method: "POST", body: { sessionId: Cust.id, ticks: [...Cust.ticks] } });
    toast(`சேமிக்கப்பட்டது: ${r.found} / ${Cust.total} கண்டறியப்பட்டது`, `Saved: found ${r.found} of ${Cust.total}`);

});

    <section class="celebrate">
      <p class="muted">சுழற்சி ${c.closed} நிறைவு<span class="en">Rotation ${c.closed} complete</span></p>
      <h1 class="big">வாழ்த்துகள்!<span class="en" style="display:block;margin:0;font-size:.5em">Congratulations!</span></h1>
      <div style="height:16px"></div>
      ${podium(c.rows)}
      ${c.hasTie ? html`<p class="warn">சமநிலை உள்ளது. பரிசுகளை மேலாளர் முடிவு செய்யவும்.<span class="en" style="display:block;margin:0">There is a tie. The manager decides the prizes.</span></p>` : ""}
      <section class="card"><p style="margin:0"><b>சுழற்சி ${c.next} தொடங்கியது!</b><span class="en" style="display:block;margin:0">Rotation ${c.next} has started.</span></p></section>
      <a class="btn btn-gold btn-block" href="#/">முகப்பு <span class="en">Home</span></a>
    </section>`);
  Sound.fanfare(); confettiBurst();
}

/* ============================================================
   MANAGER: rating screen
   ============================================================ */
const Rate = {};
async function viewRate(id) {
  if (!mgrToken()) return go("/manager");
  const my = State.nav; loading();
  let d;
  try { d = await api("/api/manager/session?id=" + encodeURIComponent(id), { auth: true }); }
  catch (e) { if (e.status === 401) return go("/manager"); throw e; }
  if (stale(my)) return;
  Object.assign(Rate, { id, d, max: d.max, weight: d.weight, ratings: new Map(), notes: new Map(), dirtyR: new Set(), dirtyN: new Set(), n: 0, done: false });
  d.modules.forEach((m) => m.concepts.forEach((c) => { Rate.ratings.set(c.id, c.rating); Rate.notes.set(c.id, c.note || ""); Rate.n++; }));
  paintRate();
}

// what the customer ticked, in order, and which ones earned order marks
function orderCard(d, s) {
  const o = d.order; if (!o) return "";
  return html`<section class="card">
    <h2>கேட்ட வரிசை <span class="en">Order asked</span> <span class="badge ${s.orderCorrect === o.total ? "done" : "wait2"}">${s.orderCorrect} / ${o.total} · ${fmt(s.order)} / ${o.weight}</span></h2>
    ${o.asked.length ? html`<ol class="askline">${o.asked.map((a) => html`<li class="${!a.scored ? "opt" : a.credited ? "ok" : "bad"}">${a.ta}<span class="en">${a.en}</span>
      ${!a.scored ? html`<small>(விருப்பம் · optional)</small>` : a.credited ? "" : html`<small>(வரிசை தவறு · out of order)</small>`}</li>`)}</ol>`
      : html`<p class="muted">வாடிக்கையாளர் இன்னும் டிக் செய்யவில்லை.<span class="en" style="display:block;margin:0">The customer has not ticked yet.</span></p>`}
    ${o.asked.length && o.missed.length ? html`<p class="muted" style="margin:0 0 6px"><b>கேட்கவில்லை · Not asked:</b> ${o.missed.map((m) => m.ta).join(", ")}</p>` : ""}
    <details><summary>சரியான வரிசை <span class="en">Intended order</span></summary>
      <ol class="askline">${o.intended.map((a) => html`<li>${a.ta}<span class="en">${a.en}</span></li>`)}</ol></details>
  </section>`;
}

function paintRate() {
  const { d, max } = Rate, s = d.session;
  const vals = Array.from({ length: max }, (_, i) => i + 1);
  paint(html`
    <p><a href="#/manager">← மேலாளர் <span class="en">Manager</span></a></p>
    <h1 class="title">மதிப்பீடு <span class="en">Rate · ${s.id}</span></h1>
    <section class="card">
      <div class="names">
        <div><small>விற்பனையாளர் · Salesperson</small><b>${s.salesperson.name}</b></div>
        <div><small>வாடிக்கையாளர் · Customer</small><b>${s.customer.name}</b></div>
      </div>
      <p>${badge(s.status)} <span class="muted">கண்டறிதல் ${fmt(s.discovery)} · வரிசை ${fmt(s.order)} · ${s.found} / 12</span></p>
      ${d.context ? html`<p class="muted" style="margin:0"><b>${d.context.persona}</b> · ${d.context.objection}</p>` : ""}
    </section>
    ${orderCard(d, s)}
    ${d.modules.map((m) => html`
      <div class="mod">மாடியூல் ${m.no}: ${m.ta}<span class="en">Module ${m.no}: ${m.en}</span></div>
      ${m.concepts.map((c) => html`
        <section class="concept" id="c-${c.id}">
          <div class="q">${c.ta}<span class="en" style="display:block;margin:0">${c.en}</span></div>
          <div class="rbar" style="--n:${max}">
            <button class="rb zero" data-act="rate" data-c="${c.id}" data-v="0" aria-pressed="${String(Rate.ratings.get(c.id) === 0)}">0 · தொடவில்லை <span class="en">Not covered</span></button>
            ${vals.map((v) => html`<button class="rb" data-act="rate" data-c="${c.id}" data-v="${v}" aria-pressed="${String(Rate.ratings.get(c.id) === v)}">${v}</button>`)}
          </div>
          <details ${Rate.notes.get(c.id) ? "open" : ""}><summary>குறிப்பு <span class="en">Note (optional)</span></summary>
            <textarea maxlength="300" data-input="note" data-c="${c.id}" aria-label="Note">${Rate.notes.get(c.id)}</textarea></details>
        </section>`)}`)}
    <div class="sticky"><div class="in">
      <div class="sum"><span id="sum-rated"></span><span>கருத்து மதிப்பெண்<span class="en">Concept score</span> <b id="sum-score"></b></span></div>
      <div class="row">
        <button class="btn" data-act="saveRate">முன்னேற்றத்தைச் சேமி <span class="en">Save progress</span></button>
        <button class="btn btn-gold" data-act="submitRate">சமர்ப்பி <span class="en">Submit</span></button>
      </div>
    </div></div>`);
  updateSummary();
}

// live concept-score preview: same maths as the sheet (total / (applicable x max) x weight)
function updateSummary() {
  let total = 0, rated = 0;
  Rate.ratings.forEach((v) => { if (v !== null) { rated++; total += v; } });
  const score = Rate.n ? (total / (Rate.n * Rate.max)) * Rate.weight : 0;
  $("#sum-rated").innerHTML = html`மதிப்பிட்டது ${rated} / ${Rate.n}<span class="en">Rated</span>`.s;
  $("#sum-score").textContent = `${fmt(Math.round(score * 100) / 100)} / ${Rate.weight}`;
}
Actions.rate = (btn) => {
  const c = btn.dataset.c, v = Number(btn.dataset.v);
  Rate.ratings.set(c, v); Rate.dirtyR.add(c);
  $$(`#c-${c} .rb`).forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === v)));
  $(`#c-${c}`).classList.remove("missing");
  updateSummary();
};
Actions.note = (el) => { Rate.notes.set(el.dataset.c, el.value); Rate.dirtyN.add(el.dataset.c); };

async function sendRatings(submit) {
  const ids = submit ? [...Rate.ratings.keys()] : [...Rate.dirtyR];
  const nids = submit ? [...Rate.notes.keys()].filter((c) => Rate.notes.get(c)) : [...Rate.dirtyN];
  const ratings = {}, notes = {};
  ids.forEach((c) => { ratings[c] = Rate.ratings.get(c); });
  nids.forEach((c) => { notes[c] = Rate.notes.get(c); });
  const r = await api("/api/manager/rate", { method: "POST", auth: true, body: { sessionId: Rate.id, ratings, notes, submit } });
  Rate.dirtyR.clear(); Rate.dirtyN.clear();
  return r.session;
}
Actions.saveRate = (btn) => busy(btn, async () => {
  if (!Rate.dirtyR.size && !Rate.dirtyN.size) return toast("மாற்றங்கள் இல்லை", "Nothing new to save");
  try { await sendRatings(false); toast("முன்னேற்றம் சேமிக்கப்பட்டது", "Progress saved"); }
  catch (e) { toastErr(e); if (e.status === 401) go("/manager"); }
});
Actions.submitRate = (btn) => busy(btn, async () => {
  const missing = [...Rate.ratings].filter(([, v]) => v === null).map(([c]) => c);
  if (missing.length) {
    missing.forEach((c) => $(`#c-${c}`).classList.add("missing"));
    $(`#c-${missing[0]}`).scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "center" });
    return toast(`சமர்ப்பிக்கும் முன் அனைத்துக்கும் மதிப்பீடு தேவை (${missing.length} மீதம்)`, `Rate every concept before submitting (${missing.length} left)`, true);
  }
  try { paintResult(await sendRatings(true)); }
  catch (e) { toastErr(e); if (e.status === 401) go("/manager"); }
});

function paintResult(s) {
  const complete = s.status === "Complete";
  const total = Rate.d?.order?.total || 0, attrN = Rate.d?.attrCount || 0, earned = [];
  if (complete && total && s.orderCorrect === total) earned.push("perfect");
  if (complete && attrN && s.found === attrN) earned.push("mind");
  paint(html`
    <h1 class="title">${complete ? "மதிப்பீடு முடிந்தது" : "மதிப்பீடு சேமிக்கப்பட்டது"} <span class="en">${complete ? "Rating complete" : "Ratings saved"} · ${s.id}</span></h1>
    <section class="card center">
      <p><b>${s.salesperson.name}</b></p>
      <div class="score3">
        <div class="full"><b>${fmt(s.final)}</b><small>இறுதி · Final / 100</small></div>
        <div><b>${fmt(s.concept)}</b><small>கருத்துகள் · Concept</small></div>
        <div><b>${fmt(s.discovery)}</b><small>கண்டறிதல் · Discovery</small></div>
        <div><b>${fmt(s.order)}</b><small>வரிசை · Order</small></div>
      </div>
      <p>${badge(s.status)}</p>
      ${earned.length ? html`<p>${earned.map((k) => html`<span class="badge done">${BADGES[k][0]} ${BADGES[k][1]} · ${BADGES[k][2]}</span> `)}</p>` : ""}
      ${complete ? "" : html`<p class="muted">வாடிக்கையாளர் டிக் செய்த பிறகு மதிப்பெண் முழுமையாகும்.<span class="en" style="display:block;margin:0">The score completes once the customer submits their ticks.</span></p>`}
    </section>
    <div class="row">
      <a class="btn btn-teal" href="#/manager">வரிசைக்குத் திரும்பு <span class="en">Back to queue</span></a>
      <a class="btn" href="#/leaderboard">தரவரிசை <span class="en">Leaderboard</span></a>
    </div>`);
  if (complete) { Sound.fanfare(); if (earned.length) confettiBurst(); }
}

/* ---------- start ---------- */
setSoundUi();
route();
</script>
</body>
</html>
